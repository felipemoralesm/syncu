<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SyncU — Mi Horario</title>
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#FF6B00" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --orange: #FF6B00; --bg: #0D0D0D; --surface: #141414;
      --card: #1A1A1A; --card2: #1e1e1e; --text: #FFFFFF;
      --muted: #666; --border: rgba(255,255,255,0.09); --max-w: 430px;
    }
    html, body { min-height:100%; background:var(--bg); color:var(--text);
      font-family:'Space Grotesk',sans-serif; overflow-x:hidden; }
    body::before { content:''; position:fixed; inset:0;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events:none; z-index:0; }

    .page { position:relative; z-index:1; max-width:var(--max-w); margin:0 auto; padding-bottom:6rem; }

    /* ── Topbar ── */
    .topbar { position:sticky; top:0; z-index:50; background:rgba(13,13,13,0.93);
      backdrop-filter:blur(14px); border-bottom:1px solid var(--border);
      padding:.9rem 1rem; display:flex; align-items:center; justify-content:space-between; }
    .topbar-left { display:flex; align-items:center; gap:.6rem; }
    .back-btn { background:none; border:none; cursor:pointer; color:var(--muted); font-size:1.1rem; transition:color .15s; }
    .back-btn:hover { color:var(--text); }
    .page-title { font-size:1.1rem; font-weight:700; letter-spacing:-.3px; }
    .save-btn { background:var(--orange); color:#fff; border:none; border-radius:8px;
      padding:.45rem 1rem; font-family:'Space Grotesk',sans-serif; font-size:.82rem; font-weight:700;
      cursor:pointer; display:flex; align-items:center; gap:.4rem; transition:background .2s, box-shadow .2s, transform .15s; }
    .save-btn:hover { background:#ff7b1a; box-shadow:0 0 18px rgba(255,107,0,.45); transform:translateY(-1px); }
    .save-btn:disabled { opacity:.45; cursor:not-allowed; transform:none; }

    /* ── Day toggles ── */
    .day-toggles { padding:.7rem 1rem; border-bottom:1px solid var(--border);
      display:flex; gap:.45rem; overflow-x:auto; scrollbar-width:none; }
    .day-toggles::-webkit-scrollbar { display:none; }
    .day-tag { flex-shrink:0; display:flex; align-items:center; gap:.3rem;
      background:var(--card); border:1px solid var(--border); border-radius:99px;
      padding:.3rem .75rem; font-size:.7rem; font-weight:600; cursor:pointer;
      user-select:none; transition:border-color .2s, background .2s; }
    .day-tag.libre { border-color:var(--orange); background:rgba(255,107,0,.08); color:var(--orange); }
    .day-tag .dot { width:6px; height:6px; border-radius:50%; background:var(--muted); transition:background .2s; }
    .day-tag.libre .dot { background:var(--orange); }

    /* ── Grid ── */
    .grid-scroll { overflow-x:auto; padding:0 0 1rem; scrollbar-width:thin; scrollbar-color:#2a2a2a transparent; }
    .schedule-grid {
      display:grid;
      grid-template-columns: 48px repeat(5,1fr);
      min-width:340px;
    }
    .col-header { position:sticky; top:0; background:var(--bg); z-index:10;
      text-align:center; font-size:.66rem; font-weight:700; letter-spacing:.08em;
      text-transform:uppercase; color:var(--muted); padding:.55rem 0;
      border-bottom:1px solid var(--border); }
    .col-header.today { color:var(--orange); }

    /* Each row is a 15-min slot; height = 14px */
    .time-label { font-size:.58rem; font-weight:500; color:var(--muted);
      text-align:right; padding:0 5px 0 0; display:flex; align-items:flex-start;
      padding-top:2px; border-right:1px solid var(--border); height:14px; }
    /* Only show label on hour boundaries */
    .time-label.hide-label { color:transparent; }

    .slot-cell { height:14px; border-bottom:1px solid rgba(255,255,255,.04);
      border-right:1px solid var(--border); background:transparent;
      position:relative; cursor:pointer; transition:background .1s; }
    .slot-cell:last-child { border-right:none; }
    .slot-cell:hover { background:rgba(255,255,255,.03); }
    /* Hour boundary: slightly stronger line */
    .slot-cell.hour-top { border-top:1px solid var(--border); }

    /* Rendered event block */
    .event-block {
      position:absolute; left:2px; right:2px; border-radius:5px;
      display:flex; align-items:flex-start; justify-content:flex-start;
      padding:3px 5px; font-size:.6rem; font-weight:700;
      color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.5);
      word-break:break-word; line-height:1.2; overflow:hidden;
      cursor:pointer; z-index:5;
      transition:filter .15s;
    }
    .event-block:hover { filter:brightness(1.18); }
    /* Libre-hoy overlay */
    .event-block.libre-hoy { opacity:.25; }
    .event-block.libre-hoy::after { content:''; position:absolute; inset:0;
      border-radius:5px; border:1.5px dashed var(--orange); }

    /* ── Add modal ── */
    .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.78);
      backdrop-filter:blur(5px); z-index:100; display:flex; align-items:flex-end; justify-content:center;
      opacity:0; pointer-events:none; transition:opacity .25s; }
    .modal-backdrop.open { opacity:1; pointer-events:all; }
    .modal { width:100%; max-width:var(--max-w); background:#181818;
      border:1px solid var(--border); border-bottom:none; border-radius:20px 20px 0 0;
      padding:1.4rem 1.25rem 2.5rem;
      transform:translateY(100%); transition:transform .35s cubic-bezier(.22,1,.36,1); }
    .modal-backdrop.open .modal { transform:translateY(0); }
    .modal-handle { width:36px; height:4px; background:#333; border-radius:99px; margin:0 auto 1.1rem; }
    .modal-title { font-size:.7rem; font-weight:700; letter-spacing:.1em;
      text-transform:uppercase; color:var(--muted); margin-bottom:.9rem; }
    .modal-subtitle { font-size:.8rem; color:var(--muted); margin-bottom:1.1rem; }
    .modal label { display:block; font-size:.7rem; font-weight:600;
      letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin-bottom:.4rem; }
    .modal input[type="text"] { width:100%; background:#222; border:1px solid #333;
      border-radius:10px; padding:.78rem 1rem; color:var(--text);
      font-family:'Space Grotesk',sans-serif; font-size:.9rem; outline:none; margin-bottom:1rem;
      transition:border-color .2s, box-shadow .2s; }
    .modal input[type="text"]:focus { border-color:var(--orange); box-shadow:0 0 0 3px rgba(255,107,0,.15); }

    /* Time row */
    .time-row { display:grid; grid-template-columns:1fr 1fr; gap:.6rem; margin-bottom:1rem; }
    .time-field label { margin-bottom:.35rem; }
    .time-input-wrap { position:relative; }
    .time-input { width:100%; background:#222; border:1px solid #333; border-radius:10px;
      padding:.72rem .9rem; color:var(--text); font-family:'Space Grotesk',sans-serif;
      font-size:.9rem; outline:none; appearance:none;
      transition:border-color .2s, box-shadow .2s; }
    .time-input:focus { border-color:var(--orange); box-shadow:0 0 0 3px rgba(255,107,0,.15); }
    /* Duration badge */
    .duration-badge { text-align:center; font-size:.72rem; color:var(--orange); font-weight:600;
      margin:-0.5rem 0 .9rem; min-height:1.1rem; }

    /* Color palette */
    .color-palette { display:flex; gap:.6rem; margin-bottom:1.4rem; flex-wrap:wrap; }
    .color-swatch { width:34px; height:34px; border-radius:50%; cursor:pointer;
      border:2.5px solid transparent; transition:transform .15s, border-color .15s; }
    .color-swatch:hover { transform:scale(1.1); }
    .color-swatch.selected { border-color:#fff; transform:scale(1.15); box-shadow:0 0 0 2px rgba(255,255,255,.2); }

    /* Days selector */
    .days-selector { display:flex; gap:.4rem; margin-bottom:1.3rem; flex-wrap:wrap; }
    .day-chip { background:#222; border:1px solid #333; border-radius:99px;
      padding:.28rem .7rem; font-size:.72rem; font-weight:600; color:var(--muted);
      cursor:pointer; transition:border-color .2s, background .2s, color .2s; user-select:none; }
    .day-chip.on { border-color:var(--orange); background:rgba(255,107,0,.1); color:var(--orange); }

    .modal-actions { display:grid; grid-template-columns:1fr 1fr; gap:.75rem; }
    .btn-cancel { padding:.85rem; background:#222; border:1px solid #333; border-radius:10px;
      color:var(--muted); font-family:'Space Grotesk',sans-serif; font-size:.9rem; font-weight:600; cursor:pointer; }
    .btn-cancel:hover { background:#2a2a2a; }
    .btn-save-class { padding:.85rem; background:var(--orange); border:none; border-radius:10px;
      color:#fff; font-family:'Space Grotesk',sans-serif; font-size:.9rem; font-weight:700; cursor:pointer;
      transition:background .2s, box-shadow .2s; }
    .btn-save-class:hover { background:#ff7b1a; box-shadow:0 0 16px rgba(255,107,0,.4); }

    /* ── Delete sheet ── */
    .delete-sheet { position:fixed; inset:0; background:rgba(0,0,0,.82);
      backdrop-filter:blur(5px); z-index:110; display:flex; align-items:flex-end; justify-content:center;
      opacity:0; pointer-events:none; transition:opacity .2s; }
    .delete-sheet.open { opacity:1; pointer-events:all; }
    .delete-panel { width:100%; max-width:var(--max-w); background:#181818;
      border:1px solid var(--border); border-bottom:none; border-radius:20px 20px 0 0;
      padding:1.4rem 1.25rem 2.5rem;
      transform:translateY(100%); transition:transform .3s cubic-bezier(.22,1,.36,1); }
    .delete-sheet.open .delete-panel { transform:translateY(0); }
    .del-name { font-size:1rem; font-weight:700; margin-bottom:.25rem; }
    .del-meta { font-size:.8rem; color:var(--muted); margin-bottom:1.3rem; }
    .del-actions { display:grid; grid-template-columns:1fr 1fr; gap:.75rem; }
    .btn-delete { padding:.85rem; background:rgba(255,60,60,.12);
      border:1px solid rgba(255,60,60,.25); border-radius:10px; color:#ff6b6b;
      font-family:'Space Grotesk',sans-serif; font-size:.9rem; font-weight:700; cursor:pointer;
      transition:background .15s; }
    .btn-delete:hover { background:rgba(255,60,60,.22); }

    /* ── Toast ── */
    .toast { position:fixed; bottom:5rem; left:50%;
      transform:translateX(-50%) translateY(20px);
      background:#1e1e1e; border:1px solid var(--border);
      color:var(--text); font-size:.82rem; font-weight:500;
      padding:.55rem 1.1rem; border-radius:99px;
      opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:300; }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    .toast.ok  { border-color:#22C55E; color:#22C55E; }
    .toast.err { border-color:#ff6b6b; color:#ff6b6b; }
    .spinner { display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,.25);
      border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; vertical-align:middle; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .gate { text-align:center; padding:4rem 2rem; color:var(--muted); }
    .gate a { color:var(--orange); }
  </style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- Add/edit modal -->
<div class="modal-backdrop" id="addModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalTitle">Nueva clase</div>
    <p class="modal-subtitle" id="modalSubtitle"></p>

    <label for="className">Nombre de la clase</label>
    <input type="text" id="className" placeholder="Ej: Cálculo I, Lab Física…" maxlength="30" />

    <div class="time-row">
      <div class="time-field">
        <label>Inicio</label>
        <input type="time" id="timeStart" class="time-input" value="08:00" />
      </div>
      <div class="time-field">
        <label>Fin</label>
        <input type="time" id="timeEnd" class="time-input" value="09:30" />
      </div>
    </div>
    <div class="duration-badge" id="durationBadge"></div>

    <label>Días</label>
    <div class="days-selector" id="daysSelector"></div>

    <label>Color</label>
    <div class="color-palette" id="colorPalette"></div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeAddModal()">Cancelar</button>
      <button class="btn-save-class" onclick="saveEvent()">Guardar</button>
    </div>
  </div>
</div>

<!-- Delete sheet -->
<div class="delete-sheet" id="deleteSheet">
  <div class="delete-panel">
    <div class="modal-handle"></div>
    <div class="modal-title">Eliminar clase</div>
    <div class="del-name" id="delName"></div>
    <div class="del-meta" id="delMeta"></div>
    <div class="del-actions">
      <button class="btn-cancel" onclick="closeDeleteSheet()">Cancelar</button>
      <button class="btn-delete" onclick="confirmDelete()">🗑 Eliminar</button>
    </div>
  </div>
</div>

<!-- Auth gate -->
<div id="authGate" class="gate" style="display:none">
  Debes <a href="../index.html">iniciar sesión</a> para ver tu horario.
</div>
<div id="loadingGate" class="gate">Cargando…</div>

<div class="page" id="mainPage" style="display:none">

  <div class="topbar">
    <div class="topbar-left">
      <button class="back-btn" onclick="history.back()">←</button>
      <span class="page-title">📅 Mi Horario</span>
    </div>
    <button class="save-btn" id="saveBtn" onclick="saveToFirestore()">Guardar</button>
  </div>

  <div class="day-toggles" id="dayToggles"></div>

  <div class="grid-scroll">
    <div class="schedule-grid" id="scheduleGrid"></div>
  </div>

</div>

<script type="module">
  import { initializeApp }    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey:"AIzaSyDkAVe9p_toQ4CAveb7iaI0bvTsJc6gSpE",
    authDomain:"syncu-3abec.firebaseapp.com", projectId:"syncu-3abec",
    storageBucket:"syncu-3abec.firebasestorage.app",
    messagingSenderId:"287232013909", appId:"1:287232013909:web:d05003a489fa0190e806dc"
  };
  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);

  // ── Constants ──────────────────────────────────────────
  const DIAS   = ['lunes','martes','miércoles','jueves','viernes'];
  const DIAS_S = ['Lun','Mar','Mié','Jue','Vie'];
  const COLORS = ['#FF6B00','#E63946','#2EC4B6','#8338EC','#3A86FF','#06D6A0'];

  // Grid: 6:00 → 20:00 in 15-min slots = 56 slots
  const START_MIN = 6 * 60;   // 360
  const END_MIN   = 20 * 60;  // 1200
  const SLOT_MIN  = 15;
  const TOTAL_SLOTS = (END_MIN - START_MIN) / SLOT_MIN; // 56

  const TODAY_IDX = (() => { const d = new Date().getDay(); return d>=1&&d<=5?d-1:-1; })();

  // ── State ───────────────────────────────────────────────
  let myUid = null;
  // events: array of {id, dia[], nombre, inicio, fin, color}
  // dia: array of dia strings (multi-day support)
  // inicio/fin: 'HH:MM'
  let events = [];
  let diasLibresHoy = new Set();
  let selectedColor = COLORS[0];
  let selectedDays  = new Set();
  let deleteTargetId = null;
  let editTargetId   = null; // null = new event

  function uid4() { return Math.random().toString(36).slice(2,6); }
  function timeToMin(t) { const [h,m] = t.split(':').map(Number); return h*60+m; }
  function minToTime(m) { return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`; }
  function durationLabel(startT, endT) {
    const d = timeToMin(endT) - timeToMin(startT);
    if (d <= 0) return '';
    const h = Math.floor(d/60), m = d%60;
    if (h && m) return `${h}h ${m}min`;
    if (h) return `${h}h`;
    return `${m}min`;
  }

  // ── Auth ────────────────────────────────────────────────
  onAuthStateChanged(auth, async user => {
    document.getElementById('loadingGate').style.display = 'none';
    if (!user) { document.getElementById('authGate').style.display = 'block'; return; }
    myUid = user.uid;
    await loadFromFirestore();
    document.getElementById('mainPage').style.display = 'block';
    buildDayToggles();
    buildGrid();
    renderAllEvents();
  });

  async function loadFromFirestore() {
    try {
      const snap = await getDoc(doc(db, 'horarios', myUid));
      if (snap.exists()) {
        const data = snap.data();
        events = (data.events || []);
        (data.diasLibresHoy || []).forEach(d => diasLibresHoy.add(d));
      }
    } catch(e) { showToast('Error al cargar','err'); }
  }

  window.saveToFirestore = async function() {
    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>';
    try {
      await setDoc(doc(db,'horarios',myUid), {
        events,
        diasLibresHoy: [...diasLibresHoy],
        updatedAt: serverTimestamp(),
      });
      showToast('✓ Horario guardado','ok');
    } catch(e) { showToast('Error al guardar','err'); }
    finally { btn.disabled=false; btn.innerHTML='Guardar'; }
  };

  // ── Day toggles ────────────────────────────────────────
  function buildDayToggles() {
    const wrap = document.getElementById('dayToggles');
    wrap.innerHTML = '';
    DIAS.forEach((dia,i) => {
      const tag = document.createElement('div');
      tag.className = `day-tag ${diasLibresHoy.has(dia)?'libre':''}`;
      tag.innerHTML = `<span class="dot"></span>${DIAS_S[i]} libre`;
      tag.addEventListener('click', () => {
        diasLibresHoy.has(dia) ? diasLibresHoy.delete(dia) : diasLibresHoy.add(dia);
        tag.classList.toggle('libre');
        renderAllEvents();
      });
      wrap.appendChild(tag);
    });
  }

  // ── Build grid (header + slot cells) ──────────────────
  function buildGrid() {
    const grid = document.getElementById('scheduleGrid');
    grid.innerHTML = '';

    // Header row
    const th = document.createElement('div');
    th.className = 'col-header';
    grid.appendChild(th);
    DIAS.forEach((dia,i) => {
      const h = document.createElement('div');
      h.className = `col-header ${i===TODAY_IDX?'today':''}`;
      h.textContent = DIAS_S[i];
      grid.appendChild(h);
    });

    // Slot rows
    for (let s = 0; s < TOTAL_SLOTS; s++) {
      const absMin = START_MIN + s * SLOT_MIN;
      const isHour = absMin % 60 === 0;
      const label  = document.createElement('div');
      label.className = `time-label ${isHour?'':'hide-label'}`;
      if (isHour) label.textContent = minToTime(absMin);
      grid.appendChild(label);

      DIAS.forEach(dia => {
        const cell = document.createElement('div');
        cell.className = `slot-cell ${isHour?'hour-top':''}`;
        cell.dataset.dia  = dia;
        cell.dataset.slot = s;
        cell.addEventListener('click', () => onCellClick(dia, s));
        grid.appendChild(cell);
      });
    }
  }

  // ── Render all events ──────────────────────────────────
  function renderAllEvents() {
    // Remove existing event blocks
    document.querySelectorAll('.event-block').forEach(e => e.remove());

    events.forEach(ev => {
      (ev.dia || []).forEach(dia => renderEvent(ev, dia));
    });
  }

  function renderEvent(ev, dia) {
    const startMin = timeToMin(ev.inicio);
    const endMin   = timeToMin(ev.fin);
    if (startMin >= endMin) return;

    const colIdx  = DIAS.indexOf(dia);
    if (colIdx < 0) return;

    // Find the DOM cell for slot at startMin
    const startSlot = (startMin - START_MIN) / SLOT_MIN;
    if (startSlot < 0 || startSlot >= TOTAL_SLOTS) return;

    const cell = document.querySelector(
      `.slot-cell[data-dia="${dia}"][data-slot="${Math.floor(startSlot)}"]`
    );
    if (!cell) return;

    const heightSlots = (endMin - startMin) / SLOT_MIN;
    const topPx    = ((startMin - START_MIN) % SLOT_MIN) / SLOT_MIN * 14; // fraction of a slot
    const heightPx = heightSlots * 14;

    const block = document.createElement('div');
    block.className = `event-block ${diasLibresHoy.has(dia)?'libre-hoy':''}`;
    block.style.cssText = `background:${ev.color};top:${topPx}px;height:${heightPx}px`;
    block.dataset.evId = ev.id;
    block.dataset.dia  = dia;
    block.textContent = ev.nombre;

    // Long press to delete/edit
    let pressTimer;
    block.addEventListener('pointerdown', () => {
      pressTimer = setTimeout(() => openDeleteSheet(ev.id, dia), 500);
    });
    block.addEventListener('pointerup',    () => clearTimeout(pressTimer));
    block.addEventListener('pointerleave', () => clearTimeout(pressTimer));
    // Single tap to edit
    block.addEventListener('click', e => {
      e.stopPropagation();
      openEditModal(ev.id);
    });

    cell.appendChild(block);
  }

  // ── Cell click: open add modal ─────────────────────────
  function onCellClick(dia, slotIdx) {
    // Don't open if click was on an existing block
    const absMin = START_MIN + slotIdx * SLOT_MIN;
    const inicio = minToTime(absMin);
    const fin    = minToTime(Math.min(absMin + 90, END_MIN));
    openAddModal(inicio, fin, dia);
  }

  // ── Add modal ──────────────────────────────────────────
  window.openAddModal = function(inicio='08:00', fin='09:30', preselDia=null) {
    editTargetId = null;
    document.getElementById('modalTitle').textContent = 'Nueva clase';
    document.getElementById('modalSubtitle').textContent = '';
    document.getElementById('className').value = '';
    document.getElementById('timeStart').value = inicio;
    document.getElementById('timeEnd').value   = fin;
    updateDurationBadge();

    // Days selector
    selectedDays = new Set(preselDia ? [preselDia] : []);
    renderDaysSelector();

    // Color palette
    selectedColor = COLORS[0];
    renderColorPalette();

    document.getElementById('addModal').classList.add('open');
    setTimeout(() => document.getElementById('className').focus(), 350);
  };

  window.openEditModal = function(evId) {
    const ev = events.find(e => e.id === evId);
    if (!ev) return;
    editTargetId = evId;
    document.getElementById('modalTitle').textContent = 'Editar clase';
    document.getElementById('modalSubtitle').textContent = '';
    document.getElementById('className').value = ev.nombre;
    document.getElementById('timeStart').value = ev.inicio;
    document.getElementById('timeEnd').value   = ev.fin;
    updateDurationBadge();
    selectedDays  = new Set(ev.dia || []);
    selectedColor = ev.color || COLORS[0];
    renderDaysSelector();
    renderColorPalette();
    document.getElementById('addModal').classList.add('open');
  };

  window.closeAddModal = function() {
    document.getElementById('addModal').classList.remove('open');
    editTargetId = null;
  };

  function renderDaysSelector() {
    const wrap = document.getElementById('daysSelector');
    wrap.innerHTML = '';
    DIAS.forEach((dia,i) => {
      const chip = document.createElement('div');
      chip.className = `day-chip ${selectedDays.has(dia)?'on':''}`;
      chip.textContent = DIAS_S[i];
      chip.addEventListener('click', () => {
        selectedDays.has(dia) ? selectedDays.delete(dia) : selectedDays.add(dia);
        chip.classList.toggle('on');
      });
      wrap.appendChild(chip);
    });
  }

  function renderColorPalette() {
    const pal = document.getElementById('colorPalette');
    pal.innerHTML = '';
    COLORS.forEach(c => {
      const sw = document.createElement('div');
      sw.className = `color-swatch ${c===selectedColor?'selected':''}`;
      sw.style.background = c;
      sw.addEventListener('click', () => {
        document.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('selected'));
        sw.classList.add('selected');
        selectedColor = c;
      });
      pal.appendChild(sw);
    });
  }

  function updateDurationBadge() {
    const s = document.getElementById('timeStart').value;
    const e = document.getElementById('timeEnd').value;
    const badge = document.getElementById('durationBadge');
    if (s && e) {
      const label = durationLabel(s, e);
      badge.textContent = label ? `Duración: ${label}` : (timeToMin(e)<=timeToMin(s)?'⚠️ Fin debe ser después del inicio':'');
    }
  }
  document.getElementById('timeStart').addEventListener('input', updateDurationBadge);
  document.getElementById('timeEnd').addEventListener('input',   updateDurationBadge);

  window.saveEvent = function() {
    const nombre = document.getElementById('className').value.trim();
    const inicio = document.getElementById('timeStart').value;
    const fin    = document.getElementById('timeEnd').value;

    if (!nombre) { document.getElementById('className').style.borderColor='#ff6b6b'; return; }
    if (!inicio || !fin || timeToMin(fin) <= timeToMin(inicio)) {
      showToast('El fin debe ser después del inicio','err'); return;
    }
    if (!selectedDays.size) { showToast('Selecciona al menos un día','err'); return; }

    if (editTargetId) {
      // Update existing
      const idx = events.findIndex(e => e.id === editTargetId);
      if (idx >= 0) {
        events[idx] = { ...events[idx], nombre, inicio, fin, color:selectedColor, dia:[...selectedDays] };
      }
    } else {
      events.push({ id:uid4(), nombre, inicio, fin, color:selectedColor, dia:[...selectedDays] });
    }

    closeAddModal();
    renderAllEvents();
    showToast(editTargetId ? 'Clase actualizada' : 'Clase agregada','ok');
  };

  // ── Delete sheet ───────────────────────────────────────
  window.openDeleteSheet = function(evId, dia) {
    const ev = events.find(e => e.id === evId);
    if (!ev) return;
    deleteTargetId = evId;
    document.getElementById('delName').textContent = ev.nombre;
    document.getElementById('delMeta').textContent =
      `${ev.dia.map(d=>DIAS_S[DIAS.indexOf(d)]).join(', ')} · ${ev.inicio}–${ev.fin}`;
    document.getElementById('deleteSheet').classList.add('open');
  };
  window.closeDeleteSheet = function() {
    document.getElementById('deleteSheet').classList.remove('open');
    deleteTargetId = null;
  };
  window.confirmDelete = function() {
    if (!deleteTargetId) return;
    events = events.filter(e => e.id !== deleteTargetId);
    closeDeleteSheet();
    renderAllEvents();
    showToast('Clase eliminada','ok');
  };

  // ── Backdrop close ─────────────────────────────────────
  document.getElementById('addModal').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeAddModal();
  });
  document.getElementById('deleteSheet').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeDeleteSheet();
  });
  document.getElementById('className').addEventListener('keydown', e => {
    if (e.key === 'Enter') window.saveEvent();
  });

  // ── Toast ──────────────────────────────────────────────
  function showToast(msg, type='') {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = `toast ${type} show`;
    setTimeout(() => t.classList.remove('show'), 2400);
  }
</script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/syncu/sw.js').catch(e => console.warn('SW:',e));
  }
</script>
</body>
</html>
